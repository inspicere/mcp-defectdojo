[project]
name = "mcp-defectdojo"
version = "3.2.7"
description = "MCP server for DefectDojo vulnerability management — 24 tools with RBAC, HMAC audit chain, and SIEM forwarding"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "inspicere" }
]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "model-context-protocol",
    "defectdojo",
    "vulnerability-management",
    "security",
    "appsec",
    "fastmcp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.2.4",
    "httpx>=0.28.1",
    "mcp>=1.27.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://github.com/inspicere/mcp-defectdojo"
Repository = "https://github.com/inspicere/mcp-defectdojo"
Issues = "https://github.com/inspicere/mcp-defectdojo/issues"
Changelog = "https://github.com/inspicere/mcp-defectdojo/blob/main/CHANGELOG.md"

[project.scripts]
mcp-defectdojo = "mcp_defectdojo.server:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip-audit>=2.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mcp_defectdojo"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]
