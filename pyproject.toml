[project]
name = "mcp-defectdojo"
version = "3.2.5"
description = "MCP server for DefectDojo vulnerability management"
readme = "README.md"
authors = [
    { name = "inspicere" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.4",
    "httpx>=0.28.1",
    "mcp>=1.27.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
mcp-defectdojo = "mcp_defectdojo.server:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip-audit>=2.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mcp_defectdojo"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]
