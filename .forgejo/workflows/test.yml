name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: docker
    container:
      image: node:22-slim
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python and uv
        run: |
          apt-get update -qq
          apt-get install -y -qq python${{ matrix.python-version }} python3-pip curl ca-certificates > /dev/null 2>&1
          pip3 install --break-system-packages "uv>=0.7,<0.8"

      - name: Install dependencies
        run: uv sync --frozen --python python${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest --tb=short -q

      - name: Vulnerability scan
        run: uv run pip-audit
