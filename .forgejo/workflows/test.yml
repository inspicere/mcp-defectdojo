name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: docker
    container:
      image: node:22-slim
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates > /dev/null 2>&1
          curl -LsSf https://astral.sh/uv/0.11.5/install.sh | env UV_INSTALL_DIR="/usr/local/bin" sh
          uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest --tb=short -q --cov --cov-fail-under=90

      - name: Vulnerability scan
        run: uv run pip-audit
