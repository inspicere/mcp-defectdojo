name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    env:
      SCAN_RESULTS_DIR: /tmp/scan-results
      TRIVY_VERSION: "v0.70.0"
      SEMGREP_VERSION: "1.99.0"
      GITLEAKS_VERSION: "8.24.3"
      GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

    steps:
      # DD #3463: pinned to commit SHA for supply-chain safety; tag v6.0.2
      # (2026-01-09) runs on Node.js 24. Node 20 was deprecated by GitHub
      # 2026-09-16. Bump SHA via:
      #   curl -s https://api.github.com/repos/actions/checkout/git/refs/tags/<tag>
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install tools
        run: |
          # DD #3465: install semgrep + full transitive dep tree via a
          # hash-pinned requirements file. Catches a compromised PyPI signing
          # event affecting any pinned package; matches the rigor of the
          # GITLEAKS_SHA256 verification below and the SHA-pinned
          # trivy-action above. To bump semgrep, edit .github/semgrep-requirements.in
          # and re-run:
          #   uv run --with pip-tools pip-compile --generate-hashes --allow-unsafe \
          #     --output-file .github/semgrep-requirements.txt .github/semgrep-requirements.in
          pip3 install --quiet --require-hashes -r .github/semgrep-requirements.txt
          INSTALLED=$(pip3 show semgrep | grep '^Version:' | cut -d' ' -f2)
          if [ "$INSTALLED" != "$SEMGREP_VERSION" ]; then
            echo "::error::Semgrep version mismatch: expected ${SEMGREP_VERSION}, got ${INSTALLED} (.github/semgrep-requirements.in out of sync with SEMGREP_VERSION env)"
            exit 1
          fi
          curl -sfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c --quiet
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm /tmp/gitleaks.tar.gz
          mkdir -p "${SCAN_RESULTS_DIR}"

      - name: Semgrep
        run: |
          semgrep --config=auto --json --quiet . > "${SCAN_RESULTS_DIR}/semgrep.json" 2>/dev/null || true
          python3 -c "
          import json, sys
          data = json.load(open('${SCAN_RESULTS_DIR}/semgrep.json'))
          results = data.get('results', [])
          if not results:
              print('Semgrep: clean')
              sys.exit(0)
          print(f'Semgrep: {len(results)} finding(s)')
          for r in results[:20]:
              sev = r.get('extra', {}).get('severity', '?').upper()
              msg = r.get('extra', {}).get('message', '').split('.')[0][:100]
              path = r.get('path', '?')
              line = r.get('start', {}).get('line', '?')
              print(f'  [{sev}] {path}:{line} — {msg}')
          if len(results) > 20:
              print(f'  ... and {len(results)-20} more')
          "

      - name: Trivy filesystem
        # Pinned to commit SHA for supply-chain safety; tag v0.36.0 (2026-04-22).
        # When bumping, fetch the new SHA via:
        #   curl -s https://api.github.com/repos/aquasecurity/trivy-action/git/refs/tags/<tag>
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          version: ${{ env.TRIVY_VERSION }}

      - name: Gitleaks
        run: |
          set +e
          gitleaks detect --source . --report-format json --report-path "${SCAN_RESULTS_DIR}/gitleaks.json" --no-banner 2>/dev/null
          GITLEAKS_EXIT=$?
          set -e
          if [ $GITLEAKS_EXIT -eq 0 ]; then
            echo "Gitleaks: clean"
          else
            count=$(python3 -c "import json; print(len(json.load(open('${SCAN_RESULTS_DIR}/gitleaks.json'))))" 2>/dev/null || echo "?")
            echo "Gitleaks: ${count} finding(s)"
          fi

      - name: Upload to DefectDojo
        if: always() && github.ref == 'refs/heads/main' && vars.DEFECTDOJO_URL != ''
        env:
          DEFECTDOJO_URL: ${{ vars.DEFECTDOJO_URL }}
          DD_API_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
        run: |
          if [ -z "$DD_API_TOKEN" ]; then
            echo "::warning::DEFECTDOJO_API_TOKEN not set — skipping upload"
            exit 0
          fi

          UPLOAD_COUNT=0
          UPLOAD_FAILURES=0

          for result_file in "${SCAN_RESULTS_DIR}"/*.json; do
            [ -f "$result_file" ] || continue
            filename=$(basename "$result_file")

            case "$filename" in
              semgrep*.json)     SCAN_TYPE="Semgrep JSON Report" ;;
              gitleaks*.json)    SCAN_TYPE="Gitleaks Scan" ;;
              *)                 echo "Unknown: $filename — skipping"; continue ;;
            esac

            python3 -c "
          import json, sys
          data = json.load(open('${result_file}'))
          if isinstance(data, dict):
              results = data.get('results', data.get('Results', data.get('leaks', [])))
              if isinstance(results, list) and len(results) == 0:
                  sys.exit(1)
          elif isinstance(data, list) and len(data) == 0:
              sys.exit(1)
          " 2>/dev/null || { echo "  ${filename}: no findings, skipping upload"; continue; }

            echo "Uploading ${filename} → DefectDojo (type: ${SCAN_TYPE})"

            HTTP_CODE=$(curl -s -o /tmp/dd-response.json -w "%{http_code}" \
              -X POST "${DEFECTDOJO_URL}/api/v2/reimport-scan/" \
              -H "Authorization: Token ${DD_API_TOKEN}" \
              -F "scan_type=${SCAN_TYPE}" \
              -F "file=@${result_file}" \
              -F "product_name=mcp-defectdojo" \
              -F "engagement_name=CI Security Scan" \
              -F "auto_create_context=true" \
              -F "active=true" \
              -F "verified=false" \
              -F "close_old_findings=true" \
              -F "close_old_findings_product_scope=false" \
              -F "deduplication_on_engagement=true" \
            )

            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "  Reimport failed (HTTP ${HTTP_CODE}), trying import-scan..."
              HTTP_CODE=$(curl -s -o /tmp/dd-response.json -w "%{http_code}" \
                -X POST "${DEFECTDOJO_URL}/api/v2/import-scan/" \
                -H "Authorization: Token ${DD_API_TOKEN}" \
                -F "scan_type=${SCAN_TYPE}" \
                -F "file=@${result_file}" \
                -F "product_name=mcp-defectdojo" \
                -F "engagement_name=CI Security Scan" \
                -F "auto_create_context=true" \
                -F "active=true" \
                -F "verified=false" \
              )
            fi

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "  OK (HTTP ${HTTP_CODE})"
              UPLOAD_COUNT=$((UPLOAD_COUNT + 1))
            else
              echo "  FAILED (HTTP ${HTTP_CODE})"
              cat /tmp/dd-response.json 2>/dev/null || true
              UPLOAD_FAILURES=$((UPLOAD_FAILURES + 1))
            fi
          done

          echo ""
          echo "DefectDojo: ${UPLOAD_COUNT} uploaded, ${UPLOAD_FAILURES} failed"
