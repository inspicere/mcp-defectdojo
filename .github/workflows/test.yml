name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.5"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest --tb=short -q --cov --cov-fail-under=90

      - name: Vulnerability scan
        # PYSEC-2025-183 (pyjwt): disputed by upstream — the report concerns
        # key-length policy which is the application's responsibility, not the
        # library's. No fix version exists (affects all releases through the
        # current latest 2.12.1, pulled in transitively via fastmcp[crypto]).
        run: uv run pip-audit --ignore-vuln PYSEC-2025-183
