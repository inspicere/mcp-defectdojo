name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # DD #3463: pinned to commit SHA for supply-chain safety; tag v6.0.2
      # (2026-01-09) runs on Node.js 24. Bump via:
      #   curl -s https://api.github.com/repos/actions/checkout/git/refs/tags/<tag>
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        # DD #3463: pinned to commit SHA; tag v8.1.0 (2026-04-16) runs on Node.js 24.
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.5"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest --tb=short -q --cov --cov-fail-under=90

      - name: Vulnerability scan
        # PYSEC-2025-183 (pyjwt): disputed by upstream — the report concerns
        # key-length policy which is the application's responsibility, not the
        # library's. No fix version exists (affects all releases through the
        # current latest 2.12.1, pulled in transitively via fastmcp[crypto]).
        run: uv run pip-audit --ignore-vuln PYSEC-2025-183
